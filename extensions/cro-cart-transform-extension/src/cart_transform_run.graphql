query CartTransformRunInput {
    cart {
        lines {
            id
            quantity

            cost {
                amountPerQuantity {
                    amount
                }
            }

            merchandise {
                __typename
                ... on ProductVariant {
                    id
                    product {
                        id
                    }
                }
            }

            croData: attribute(key: "_cro_data") {
                value
            }

            parentRelationship {
                parent {
                    id
                }
            }

            sellingPlanAllocation {
                sellingPlan {
                    id
                }
            }
        }
    }

    presentmentCurrencyRate

    shop {
        localTime {
            date
        }
    }

    cartTransform {
        bxgy: metafield(namespace: "$app:cro-bundle", key: "bxgyRules") {
            jsonValue
        }
    }
}
