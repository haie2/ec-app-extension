api_version = "2026-07"
uid = "cc21975c-8cfa-adb6-1fdf-a4a7ab5fe3ace49ccf25"

[[extensions]]
name = "t:name"
handle = "cro-cart-transform-extension"
type = "function"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/cro-cart-transform-extension.wasm"
  watch = [ "src/**/*.rs" ]
